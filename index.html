<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Felxbox</title>
</head>
<body>
    <div class="kozep">
        <div class="kozep-doboz">középen vagyok</div>
    </div>
    <div class="container">
        <div class="box box1">egy megérett a meggy</div>
        <div class="box box2">kettő csipkebokor vessző</div>
        <div class="box box3">három te vagy az én párom</div>
        <div class="box box4">négy hess te dongó légy</div>
        <div class="box box5">öt érik a tök</div>
        <div class="box box6">hat hasad a pad</div>
        <div class="box box7">hét dörög az ég</div>
        <div class="box box8">nyolc leesik a polc</div>
        <div class="box box9">kilenc kis ferenc</div>
        <div class="box box10">tíz tiszta a víz. Ha nem tiszta vidd vissza majd a szamár megissza.</div>
    </div>
</body>
</html>
